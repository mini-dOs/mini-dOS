set timeout=5
set default=0

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial console	# 비디오 출력을 위해 console 추가

insmod all_video	# GOP(Graphics Output Protocol) 포함 모든 비디오 드라이버 로드
set gfxmode=auto	# 사용 가능한 모드 자동 선택
set gfxpayload=keep	# 커널 로드 후에도 설정된 프레임버퍼 유지

menuentry "mini-dOs" {
    multiboot2 /boot/kernel.elf
    boot
}
