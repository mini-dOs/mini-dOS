set timeout=5
set default=0

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial
terminal_output serial console	# 비디오 출력을 위해 console 추가

insmod all_video	# GOP(Graphics Output Protocol) 포함 모든 비디오 드라이버 로드
set gfxmode=1280x800x32,auto	# (gfxterm용) 모드. 이 환경 OVMF virtio GOP 최대가 1280x800
set gfxpayload=1280x800x32	# 커널 핸드오프 해상도 (1920x1080은 OVMF GOP가 미노출 → 1280x800 확정)

menuentry "mini-dOs" {
    multiboot2 /boot/kernel.elf
    module2 /boot/doom1.wad doom1.wad
    boot
}
